# Publishes the static site to GitHub Pages.
# The repository must use GitHub Actions as the Pages source before a deploy can succeed.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check chronicle integrity
        run: python3 scripts/verify_site.py
      - name: Check bastion rules
        run: node --test bastion-tracker/js/rules.test.js
      - name: Check bastion database rules
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql
          bash bastion-tracker/supabase/test_rls.sh

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir -p _site/eternal-concord _site/bastion-tracker
          cp index.html .nojekyll _site/
          cp eternal-concord/index.html eternal-concord/eternal-concord-session-chronicle.pdf _site/eternal-concord/
          cp -a bastion-tracker/. _site/bastion-tracker/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
